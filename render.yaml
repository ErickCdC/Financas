# Render (plano grátis). O disco do plano grátis apaga ao reiniciar:
# configure GITHUB_TOKEN para o backup automático (veja o README).
services:
  - type: web
    name: financas
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_PASSWORD
        sync: false          # você digita no painel
      - key: APP_SECRET
        generateValue: true  # chave interna (sessões e notificações)
      - key: CRON_TOKEN
        generateValue: true  # copie para o Secret CRON_TOKEN do GitHub
      - key: GITHUB_TOKEN
        sync: false          # token do GitHub com acesso de escrita ao repositório
      - key: GITHUB_REPO
        value: ErickCdC/Financas
      - key: GITHUB_BRANCH
        value: dados
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: HOST
        value: 0.0.0.0
      - key: BANCO_MCP_KEY
        sync: false          # opcional
