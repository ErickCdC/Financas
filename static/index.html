<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Controle financeiro pessoal: contas, teto semanal, parcelas e projeção.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<title>Finanças</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginform" autocomplete="on">
    <img class="logo" src="/logo.svg" alt="">
    <div>
      <h1>Finanças</h1>
      <p>Seu controle de contas, gastos e caixinha.</p>
    </div>
    <label class="field"><span>Senha</span>
      <input id="pw" class="input" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn block" id="loginbtn">Entrar</button>
    <div id="loginerr" class="err" role="alert"></div>
  </form>
</div>

<div class="shell" id="shell">
  <aside class="sidebar" aria-label="Navegação">
    <div class="brand"><img src="/logo.svg" alt="">Finanças</div>
    <nav id="sidenav"></nav>
    <button class="btn block side-cta" data-act="addspend"><svg class="i"><use href="#i-plus"/></svg>Lançar gasto</button>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <div>
    <div id="offline" class="offline-bar" hidden>Sem conexão — mostrando os últimos dados salvos</div>
    <header class="topbar" id="topbar">
      <div class="brand"><img src="/logo.svg" alt="">Finanças</div>
      <div class="title" id="pagetitle"></div>
      <div class="spacer"></div>
      <button class="iconbtn" data-act="refresh" id="refreshbtn" aria-label="Atualizar"><svg class="i"><use href="#i-refresh"/></svg></button>
      <div id="syncbar" class="syncbar" hidden role="status" aria-live="polite">
        <div class="sb-row"><span class="sb-ic"><svg class="i"><use href="#i-bank"/></svg></span><span class="sb-t" id="sbtext">Sincronizando…</span><span class="sb-p num" id="sbpct"></span></div>
        <div class="sb-bar"><i id="sbfill"></i></div>
      </div>
    </header>
    <main id="view" class="view" aria-live="polite">
      <div class="boot"><div><img src="/logo.svg" alt=""><div id="bootmsg">Carregando…</div></div></div>
    </main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Navegação"></nav>
<button class="fab" data-act="addspend" id="fab" aria-label="Lançar gasto"><svg class="i"><use href="#i-plus"/></svg>Gasto</button>
<div id="toast" class="toast" role="status"></div>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></symbol>
  <symbol id="i-bills" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4h-12A1.5 1.5 0 0 0 4 5.5V18a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-3"/><path d="M4 7h15a1 1 0 0 1 1 1v3"/><path d="M21 11h-4a2.5 2.5 0 0 0 0 5h4z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.5 1.5A3.75 3.75 0 0 1 17.5 18z"/></symbol>
  <symbol id="i-bank" viewBox="0 0 24 24"><path d="M3 9 12 4l9 5"/><path d="M5 10v7M9.5 10v7M14.5 10v7M19 10v7"/><path d="M3 20h18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4M12 17h0"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h0"/></symbol>
  <symbol id="i-piggy" viewBox="0 0 24 24"><path d="M5 11a6 5 0 0 1 6-5h2.5A6 5 0 0 1 19 9.5l2 .5v3l-2 .8A6 6 0 0 1 16 17v2.5h-2.5V18h-3v1.5H8V17a5.5 5.5 0 0 1-3-4.5H3.5v-2z"/><circle cx="15.5" cy="10.5" r=".6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 16l4-4-4-4M19 12H9"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8-9 9z"/><circle cx="8" cy="8" r="1.3"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2.5l2 11h10.5l2-8H6.5"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16V12l2-5h10l2 5v4"/><path d="M3.5 12h17v4.5h-17z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></symbol>
  <symbol id="i-food" viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8M8 3v6"/><path d="M17 21V3c-2 1-3 4-3 7 0 2 1 3 3 3"/></symbol>
  <symbol id="i-house" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-install" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M12 8v7M9 12l3 3 3-3"/></symbol>
</svg>
<script src="/app.js"></script>
</body>
</html>
